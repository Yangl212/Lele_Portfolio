<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="introduce.css">
</head>
<body>
    <audio id="ringtone" src="assets/audio/ringtone.mp3" preload="auto" autoplay></audio>

    <div class="call" id="callOverlay">
        <div class="call__pulse"></div>
        <button id="answerBtn" class="btn btn--primary" type="button">接听</button>
    </div>

    <main class="stage">
        <div class="video-frame" id="videoFrame" aria-live="polite">
            <video id="introVideo" class="video" controls playsinline preload="metadata">
                <source src="assets/videos/introduce.mp4" type="video/mp4">
            </video>
        </div>

        <button id="continueBtn" class="btn btn--ghost is-hidden" type="button" disabled>
            接取任务
        </button>
    </main>

    <script src="introduce.js"></script>
</body>
</html>
